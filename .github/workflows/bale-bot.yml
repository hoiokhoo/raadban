name: رصدبان‌بات — خبررسان ریل‌تایم بله (هر ~۱۰ دقیقه)

on:
  schedule:
    - cron: '*/10 * * * *' # اسلات اصلی — هر ۱۰ دقیقه؛ ضدتکرار state مانع ارسال دوبارهٔ همان خبر می‌شود
    - cron: '6,16,26,36,46,56 * * * *' # اسلات پشتیبان — در ساعات شلوغی گیت‌هاب اجرای رأس اسلات ممکن است تأخیر طولانی داشته باشد
  workflow_dispatch:
    inputs:
      discover_chats:
        description: 'فقط کشف چت‌ها/کانال‌ها (بدون جمع‌آوری خبر و ارسال)'
        type: boolean
        default: false
      force_digest:
        description: 'ارسال فوری تحلیل جامع + گزارش بازار (آزمون — مستقل از اسلات‌ها)'
        type: boolean
        default: false
  # چرخهٔ خودادامه: هر اجرا پس از خواب کوتاه، اجرای بعدی را خودش dispatch می‌کند (پایین)

concurrency:
  # نقد سخت‌گیرانهٔ ۲۱ نوامبر: گروهِ جدا برای force_digest یعنی اجرای هم‌زمان دو چرخه با دو
  # نسخهٔ fork‌شدهٔ state.json — هر دو ارسال می‌کنند، بازندهٔ push علامت‌های ضدتکرارش را از دست
  # می‌دهد و چرخهٔ بعد «همهٔ بازه را دوباره» می‌فرستد (ارسال دوباره). حالا «همهٔ» اجراها
  # (زنجیره + cron + force) در یک گروه صف می‌شوند — سریال یعنی state تک‌خطی و بی‌تصادم؛
  # هزینه: ران فوری حداکثر ~۱۰ دقیقه پشت صف می‌ماند (اشتباه تکرارِ خبر از تأخیر بدتر است).
  group: bale-bot
  cancel-in-progress: false # اجراها پشت‌سرهم صف می‌شوند؛ ضدتکرار state مانع ارسال دوبارهٔ همان خبر می‌شود

permissions:
  contents: write # برای کامیت bot/state.json (حافظهٔ ضدتکرار)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # چرخه = اجرای ربات (۲-۴ دقیقه) + انتظار ~۷ دقیقه تا dispatch چرخهٔ بعد
    steps:
      - name: دریافت ریپو
        uses: actions/checkout@v4

      # ── مهاجرت حافظهٔ ضدتکرار به شاخهٔ bot-state (ممیزی ۲۵ نوامبر — پیشنهاد اعمال‌شده):
      #    هر ~۱۰ دقیقه یک کامیت state به main می‌رفت (≈۱۴۴ کامیت/روز؛ ریپو روز به روز سنگین‌تر).
      #    حالا state روی شاخهٔ تک‌کامیتیِ اختصاصی bot-state با force-push به‌روز می‌شود — main
      #    برای همیشه پاک می‌ماند و تاریخچه رشد نمی‌کند. bot/state.json داخل main فقط «seed»ِ
      #    اولین اجراست (فروزن)؛ بار زندهٔ هر اجرا از bot-state می‌آید.
      #    اگر شاخه موجود باشد اما بارگذاری نشد، اجرا عمداً متوقف می‌شود — سکوتِ یک چرخه از
      #    ارسال دوبارهٔ خبرها بهتر است (۳۶ ساعت TTL علامت‌ها). ──
      - name: بارگذاری حافظهٔ ضدتکرار از شاخهٔ bot-state
        id: load-state
        run: |
          REF=$(git ls-remote origin refs/heads/bot-state | cut -f1)
          if [ -z "$REF" ]; then
            echo "شاخهٔ bot-state هنوز ساخته نشده — seed درون ریپو استفاده می‌شود (اولین اجرای پس از مهاجرت)"
          elif git fetch --depth=1 origin bot-state 2>/dev/null \
            && git show FETCH_HEAD:bot/state.json > bot/state.json 2>/dev/null \
            && [ -s bot/state.json ]; then
            echo "state زنده از شاخهٔ bot-state بارگذاری شد ($REF)"
          else
            echo "::error::شاخهٔ bot-state موجود است اما بارگذاری نشد — برای جلوگیری از ارسال دوباره این اجرا متوقف می‌شود؛ چرخهٔ بعد دوباره تلاش می‌کند"
            exit 1
          fi

      - name: نصب Bun
        uses: oven-sh/setup-bun@v2

      - name: نصب وابستگی‌ها (adhan برای اوقات شرعی + بقیهٔ بانک)
        run: bun install --frozen-lockfile

      - name: اجرای ربات (جمع‌آوری، ترجمه، ارسال به بله — خبر + توییت)
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }} # کانال‌های ادمین‌شده — اختیاری، جداشده با ویرگول
          BALE_CATEGORIES: ${{ secrets.BALE_CATEGORIES }} # توکن بات هر بخش خبری (سیاسی/ورزشی/...) — از اپلیکیشن همگام می‌شود
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }} # استخر کلیدهای جمینی — اولویت اول و چرخش خودکار
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          NEWS_WINDOW_HOURS: '3'
          MAX_ITEMS: '12'
          MAX_TWEETS: '8'
          TWEET_ACCOUNTS_PER_CYCLE: '10'
          TWEET_WINDOW_HOURS: '5' # پنجرهٔ تازگی توییت‌ها — مستقل از خبر (خواستهٔ ۱۶ نوامبر: تروث‌سوشال ترامپ + مقامات ایرانی/جهانی)
          BOT_STATE_FILE: bot/state.json
          # ── حالت کانال (خواستهٔ ۱۲ نوامبر ۲۰۲۶): بستهٔ خبری هر ۲ ساعت (اسلات‌های زوج تهران) +
          #    بستهٔ جداگانهٔ توییت‌های افراد تأثیرگذار یک ساعت بعد (اسلات‌های فرد) + تحلیل جامع + گزارش بازار ──
          CHANNEL_MODE: 'bundle' # bundle = بستهٔ ۲ساعتهٔ خبر + بستهٔ جداگانهٔ توییت | analysis = فقط تحلیل جامع+بازار | news = خبر پیاپی
          BUNDLE_PERIOD_HOURS: '2' # دورهٔ بستهٔ خبری به ساعت — اسلات‌های قطعی: ۰۰، ۰۲، ۰۴، … به وقت تهران
          TWEET_OFFSET_HOURS: '1' # فاصلهٔ بستهٔ توییت از بستهٔ خبر — اسلات‌های ۰۱، ۰۳، ۰۵، … (یک ساعت بعد)
          # ── سقف حجم بسته‌ها (خواستهٔ ۲۵ نوامبر + نیم ۲۶ نوامبر: «حجم اخبارمون خیلی زیاده») ──
          # گیت اهمیتِ موتور ورودی خبر (news-intake) شانهٔ اول است — کم‌اهمیت‌ها اصلاً وارد صف
          # نمی‌شوند؛ این سقف سپر دوم است. ۱۶ = ۲ کارت ۸ردیفی خبر؛ مازاد به اسلات بعد به تعویق
          # (هیچ حذف نمی‌شود؛ جنگ/ایران هرگز به تعویق نمی‌افتند).
          NEWS_BUNDLE_MAX_ITEMS: '16'
          TWEET_BUNDLE_MAX_ITEMS: '16'
          # ── موتور ورودی خبر (خواستهٔ ۲۶ نوامبر ۲۰۲۶ — bot/news-intake.ts): تبلیغ/بازنشر
          #    توییت/ناساز تاریخی/کم‌اهمیت هرگز وارد صف و پیکرهٔ تحلیل نمی‌شوند ──
          NEWS_IMPORTANCE_THRESHOLD: '55' # امتیاز ۰..۱۰۰ — کمتر از این = کم‌اهمیت (نمونهٔ کاربر: ثبت‌نام اعتکاف استانی)
          # ممیزی ۲۷ نوامبر — سهمیهٔ حداقل حذف شد (پیش‌فرض ۰): «اخبار بی‌اهمیت رو دیگه منتشر
          # نکنی»؛ روز بی‌خبر = بستهٔ خبر ساکت (تحلیل ۸ساعته و توییت‌ها همچنان می‌روند). برای
          # بازگرداندن رفتار قدیمی این خط را به '3' برگردانید.
          NEWS_INTAKE_MIN_KEEP: '0'
          NEWS_DAILY_MAX_ITEMS: '96' # سپر سوم حجم (ممیزی ۲۷ نوامبر) — سقف روزانهٔ انتشار خبر؛ مازاد به فردا به‌تعویق
          ATTRIBUTION_VERIFY_MAX: '6' # سقف تأیید وبِ ارجاع‌ها («به نقل از بلومبرگ» → رسانهٔ اصلی) در هر اسلات
          SALE_CHANNELS: 'Akharin_khodro' # اطلاعیهٔ فروش/پیش‌فروش خودرو (t.me/s/<id>) — فوراً اعلام می‌شود
          BOT_DAILY_SETTINGS_FILE: bot/daily-settings.json # پیام صبحگاهی ۰۵:۴۵ (خواستهٔ ۲۰ نوامبر ششم) و شبانگاهی ۲۱:۰۰ + اوقات شرعی
          # ── تحلیل جامع ۸ساعتهٔ یکپارچه (خواستهٔ ۲۰ نوامبر سوم): «کلا در طی روز یه بستهٔ سه‌تایی
          #    هشت‌ساعتهٔ تحلیل جامع» با وزن ۶۰٪ (۸ ساعت اخیر) / ۳۰٪ (۲۴ ساعت) / ۱۰٪ (یک هفته) —
          #    تحلیل جامع ۰۸/۱۴/۲۰ و شبانهٔ ۲۲:۳۰ در بسته‌های ۰۶/۱۴/۲۲ ادغام و با «none» خاموش شدند ──
          DIGEST_HOURS: 'none' # ادغام در تحلیل جامع ۸ساعته — دیگر به‌طور جداگانه ارسال نمی‌شود
          GEO_HOURS: '6,14,22' # بستهٔ سه‌تایی ۸ساعتهٔ تحلیل جامع — ۰۶ صبحگاهی / ۱۴ ظهرگاهی / ۲۲ شبانگاهی تهران
          PRICE_HOURS: '15:00' # گزارش بازار و نمودار دارایی‌ها: فقط یکبار در روز ساعت ۱۵ (خواستهٔ ۲۰ نوامبر ششم + ۲۳ نوامبر: «بخش قیمتها و نمودار قیمتی باید ساعت ۱۵ هرروز باشه نه ساعت ۳ صبح») — درصد تغییر نسبت به ساعت ۱۵ روز قبل (snapshot گزارش دیروز)
          NIGHTLY_HOURS: 'none' # ادغام در بستهٔ شبانگاهی ۲۲:۰۰ — آرشیو روز همان‌جا مصرف می‌شود
          BOT_DAILY_POOL_CAP: '260' # آرشیو روزانهٔ سبک‌تر (نقد ۲۰ نوامبر چهارم: ۴۲۹KB → ~۲۱۵KB)
          CAR_CHANNELS: 'irankhodro3007,akhbar_khodroei,Akharin_khodro' # کانال(های) قیمت روز خودرو در تلگرام (فهرست «مدل⬅️قیمت»)
          # ورودی dispatch آزمون: ارسال فوری تحلیل جامع + گزارش بازار مستقل از اسلات‌ها
          # (REST dispatch بولین را گاهی «true» رشته‌ای می‌دهد — هر دو صورت مقایسه می‌شود)
          FORCE_DIGEST: ${{ (inputs.force_digest == true || inputs.force_digest == 'true') && '1' || '' }}
          FORCE_PRICE: ${{ (inputs.force_digest == true || inputs.force_digest == 'true') && '1' || '' }}
          # فونت فارسی کارت‌ها (نازنین + وزیرمتن) — fontconfig فقط از محیطِ آغاز فرایند می‌خواند؛
          # تخصیص process.env در bun به کتابخانهٔ native نمی‌رسد (یافتهٔ ۱۵ نوامبر ۲۰۲۶)
          FONTCONFIG_FILE: ${{ github.workspace }}/.fontconfig.conf
        run: bun bot/bot.ts ${{ inputs.discover_chats == true && '--discover-chats' || '' }} ${{ (inputs.force_digest == true || inputs.force_digest == 'true') && '--force-digest' || '' }}

      # ── ثبت state در شاخهٔ bot-state (نه main!) — ممیزی ۲۵ نوامبر: شاخهٔ تک‌کامیتیِ
      #    اختصاصی؛ هر اجرا با force-push همان یک کامیت را بازمی‌سازد (plumbing — بدون
      #    جابه‌جایی working tree). blob یکسان → push لازم نیست. تاریخچهٔ main دیگر رشد
      #    نمی‌کند؛ state همچنان کاملاً ماندگار و قابل بازرسی است (شاخه عمومی bot-state).
      #    !cancelled + گیت موفقیتِ بارگذاری: (۱) شکست ربات هم state را ثبت می‌کند —
      #    finallyِ خود ربات ذخیره می‌کند و علامت‌ها نمی‌پرند (پیش‌تر قدم بعدی رد می‌شد و
      #    علامت‌های ارسالِ انجام‌شده گم می‌شدند)؛ (۲) شکستِ بارگذاری state یعنی ثبتِ seed
      #    کهنه و برگشتِ حافظه است — عمداً رد می‌شود؛ (۳) لغو دستی هم push نمی‌کند. ──
      - name: ثبت حافظهٔ ضدتکرار (state) در شاخهٔ bot-state
        if: ${{ !cancelled() && steps.load-state.outcome == 'success' }}
        run: |
          git config user.name "raadban-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ ! -s bot/state.json ]; then
            echo "::warning::bot/state.json خالی/گم است — چیزی ثبت نمی‌شود"
            exit 0
          fi
          BLOB=$(git hash-object -w bot/state.json)
          git fetch --depth=1 origin bot-state 2>/dev/null || true
          PREV=$(git rev-parse FETCH_HEAD:bot/state.json 2>/dev/null || true)
          if [ "$PREV" = "$BLOB" ]; then
            echo "state تغییری نکرد — push لازم نیست"
            exit 0
          fi
          TREE_BOT=$(printf '100644 blob %s\tstate.json\n' "$BLOB" | git mktree)
          TREE_ROOT=$(printf '040000 tree %s\tbot\n' "$TREE_BOT" | git mktree)
          COMMIT=$(git commit-tree "$TREE_ROOT" -m "state $(date -u +'%Y-%m-%dT%H:%MZ')")
          # ممیزی ۲۷ نوامبر — push سه‌تلاشی: شکست تک‌تلاشیِ push (شبکه/گیت‌هاب لرزشی) یعنی
          # چرخهٔ بعد state کهنه بار می‌کند و همهٔ ارسال‌های داخل پنجرهٔ ضدتکرار دوباره
          # پیام می‌سازند؛ سه تلاش با فاصله، احتمال گم‌شدن state را عملاً صفر می‌کند.
          for ATTEMPT in 1 2 3; do
            if git push --force origin "$COMMIT:refs/heads/bot-state"; then
              echo "state در تلاش $ATTEMPT ثبت شد"
              exit 0
            fi
            echo "::warning::push state در تلاش $ATTEMPT ناموفق بود — ۱۵ ثانیه بعد دوباره"
            sleep 15
          done
          echo "::error::ثبت state پس از سه تلاش ناموفق — چرخهٔ بعد state کهنه می‌خواند (خطر ارسال دوباره)؛ رسیدگی شود"
          exit 1

      # چرخهٔ خودادامهٔ ۲۴ ساعته: هر اجرا پس از ~۷ دقیقه انتظار، اجرای بعدی را خودش راه می‌اندازد.
      # با اجرای ~۲ تا ۴ دقیقه‌ای ربات، فاصلهٔ واقعی پیام‌ها ≈ هر ۱۰ دقیقه — ریل‌تایم بدون لیمیت.
      # ریپوی عمومی: دقایق رانر گیت‌هاب رایگان و نامحدود است (۲۸۸ اجرا/روز ≈ ۹۰۰ دقیقه/روز — بدون هزینه).
      # نکته: dispatch با GITHUB_TOKEN اجرای جدید نمی‌سازد؛ برای همین از BOT_DISPATCH_TOKEN استفاده می‌شود.
      - name: ادامهٔ زنجیرهٔ ۲۴ ساعته (راه‌اندازی چرخهٔ بعد)
        if: always() # حتی اگر ربات خطا داد، زنجیره نبخشد
        env:
          GH_TOKEN: ${{ secrets.BOT_DISPATCH_TOKEN }}
        run: |
          sleep 420 # ~۷ دقیقه — فاصلهٔ چرخهٔ بعدی از همین اجرا؛ در حالت کشف چت‌ها بی‌اثر است
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/bale-bot.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}" --silent \
            && echo "چرخهٔ بعدی راه‌اندازی شد" \
            || echo "::warning::dispatch چرخهٔ بعدی ناموفق بود — cron پشتیبان چرخه را ادامه می‌دهد"
