name: رصدبان‌بات — خبررسان ریل‌تایم بله (هر ~۱۰ دقیقه)

on:
  schedule:
    - cron: '*/10 * * * *' # اسلات اصلی — هر ۱۰ دقیقه؛ ضدتکرار state مانع ارسال دوبارهٔ همان خبر می‌شود
    - cron: '6,16,26,36,46,56 * * * *' # اسلات پشتیبان — در ساعات شلوغی گیت‌هاب اجرای رأس اسلات ممکن است تأخیر طولانی داشته باشد
  workflow_dispatch:
    inputs:
      discover_chats:
        description: 'فقط کشف چت‌ها/کانال‌ها (بدون جمع‌آوری خبر و ارسال)'
        type: boolean
        default: false
      force_digest:
        description: 'ارسال فوری تحلیل جامع + گزارش بازار (آزمون — مستقل از اسلات‌ها)'
        type: boolean
        default: false
  # چرخهٔ خودادامه: هر اجرا پس از خواب کوتاه، اجرای بعدی را خودش dispatch می‌کند (پایین)

concurrency:
  # ران فوری (force_digest) گروه مستقل دارد — پشت ران‌های زنجیره صف نمی‌شود و کنسل نمی‌شود
  group: ${{ (inputs.force_digest == true || inputs.force_digest == 'true') && 'bale-bot-force' || 'bale-bot' }}
  cancel-in-progress: false # اجراها پشت‌سرهم صف می‌شوند؛ ضدتکرار state مانع ارسال دوبارهٔ همان خبر می‌شود

permissions:
  contents: write # برای کامیت bot/state.json (حافظهٔ ضدتکرار)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # چرخه = اجرای ربات (۲-۴ دقیقه) + انتظار ~۷ دقیقه تا dispatch چرخهٔ بعد
    steps:
      - name: دریافت ریپو
        uses: actions/checkout@v4

      - name: نصب Bun
        uses: oven-sh/setup-bun@v2

      - name: نصب وابستگی‌ها (adhan برای اوقات شرعی + بقیهٔ بانک)
        run: bun install --frozen-lockfile

      - name: اجرای ربات (جمع‌آوری، ترجمه، ارسال به بله — خبر + توییت)
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }} # کانال‌های ادمین‌شده — اختیاری، جداشده با ویرگول
          BALE_CATEGORIES: ${{ secrets.BALE_CATEGORIES }} # توکن بات هر بخش خبری (سیاسی/ورزشی/...) — از اپلیکیشن همگام می‌شود
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }} # استخر کلیدهای جمینی — اولویت اول و چرخش خودکار
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          NEWS_WINDOW_HOURS: '3'
          MAX_ITEMS: '12'
          MAX_TWEETS: '8'
          TWEET_ACCOUNTS_PER_CYCLE: '6'
          BOT_STATE_FILE: bot/state.json
          # ── حالت کانال (خواستهٔ ۱۲ نوامبر ۲۰۲۶): بستهٔ خبری هر ۲ ساعت (اسلات‌های زوج تهران) +
          #    بستهٔ جداگانهٔ توییت‌های افراد تأثیرگذار یک ساعت بعد (اسلات‌های فرد) + تحلیل جامع + گزارش بازار ──
          CHANNEL_MODE: 'bundle' # bundle = بستهٔ ۲ساعتهٔ خبر + بستهٔ جداگانهٔ توییت | analysis = فقط تحلیل جامع+بازار | news = خبر پیاپی
          BUNDLE_PERIOD_HOURS: '2' # دورهٔ بستهٔ خبری به ساعت — اسلات‌های قطعی: ۰۰، ۰۲، ۰۴، … به وقت تهران
          TWEET_OFFSET_HOURS: '1' # فاصلهٔ بستهٔ توییت از بستهٔ خبر — اسلات‌های ۰۱، ۰۳، ۰۵، … (یک ساعت بعد)
          SALE_CHANNELS: 'Akharin_khodro' # اطلاعیهٔ فروش/پیش‌فروش خودرو (t.me/s/<id>) — فوراً اعلام می‌شود
          BOT_DAILY_SETTINGS_FILE: bot/daily-settings.json # پیام صبحگاهی ۰۵:۰۰ و شبانگاهی ۲۱:۰۰ + اوقات شرعی
          DIGEST_HOURS: '8,14,20' # اسلات‌های تحلیل جامع به وقت تهران (صبح/بعدازظهر/شب)
          PRICE_HOURS: '12:30,21:00' # گزارش بازار: ظهر و شب (خواستهٔ کاربر)
          NIGHTLY_HOURS: '22:30' # تحلیل جامع شبانه: هر شب کلِ روز — تحلیل + نتیجه‌گیری + حافظهٔ تاریخ‌دار روزهای قبل (خواستهٔ کاربر ۱۳ نوامبر)
          CAR_CHANNELS: 'irankhodro3007,akhbar_khodroei,Akharin_khodro' # کانال(های) قیمت روز خودرو در تلگرام (فهرست «مدل⬅️قیمت»)
          # ورودی dispatch آزمون: ارسال فوری تحلیل جامع + گزارش بازار مستقل از اسلات‌ها
          # (REST dispatch بولین را گاهی «true» رشته‌ای می‌دهد — هر دو صورت مقایسه می‌شود)
          FORCE_DIGEST: ${{ (inputs.force_digest == true || inputs.force_digest == 'true') && '1' || '' }}
          FORCE_PRICE: ${{ (inputs.force_digest == true || inputs.force_digest == 'true') && '1' || '' }}
        run: bun bot/bot.ts ${{ inputs.discover_chats == true && '--discover-chats' || '' }} ${{ (inputs.force_digest == true || inputs.force_digest == 'true') && '--force-digest' || '' }}

      - name: ثبت حافظهٔ ضدتکرار (state) در ریپو
        run: |
          git config user.name "raadban-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/state.json
          if git diff --cached --quiet; then
            echo "state تغییری نکرد — کامیت لازم نیست"
          else
            git commit -m "وضعیت ضدتکرار ربات: $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      # چرخهٔ خودادامهٔ ۲۴ ساعته: هر اجرا پس از ~۷ دقیقه انتظار، اجرای بعدی را خودش راه می‌اندازد.
      # با اجرای ~۲ تا ۴ دقیقه‌ای ربات، فاصلهٔ واقعی پیام‌ها ≈ هر ۱۰ دقیقه — ریل‌تایم بدون لیمیت.
      # ریپوی عمومی: دقایق رانر گیت‌هاب رایگان و نامحدود است (۲۸۸ اجرا/روز ≈ ۹۰۰ دقیقه/روز — بدون هزینه).
      # نکته: dispatch با GITHUB_TOKEN اجرای جدید نمی‌سازد؛ برای همین از BOT_DISPATCH_TOKEN استفاده می‌شود.
      - name: ادامهٔ زنجیرهٔ ۲۴ ساعته (راه‌اندازی چرخهٔ بعد)
        if: always() # حتی اگر ربات خطا داد، زنجیره نبخشد
        env:
          GH_TOKEN: ${{ secrets.BOT_DISPATCH_TOKEN }}
        run: |
          sleep 420 # ~۷ دقیقه — فاصلهٔ چرخهٔ بعدی از همین اجرا؛ در حالت کشف چت‌ها بی‌اثر است
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/bale-bot.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}" --silent \
            && echo "چرخهٔ بعدی راه‌اندازی شد" \
            || echo "::warning::dispatch چرخهٔ بعدی ناموفق بود — cron پشتیبان چرخه را ادامه می‌دهد"
