name: بررسی کلیدهای جمینی (بدون ارسال پیام)

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: gemini-check
      cancel-in-progress: false
    steps:
      - name: آزمون تک‌تک کلیدهای استخر (فقط نتیجهٔ ماسک‌شده — کلید هرگز چاپ نمی‌شود)
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          raw = os.environ.get('GEMINI_API_KEYS', '')
          keys = []
          try:
              arr = json.loads(raw)
              if isinstance(arr, list):
                  keys = [k for k in arr if isinstance(k, str) and k.strip()]
          except Exception:
              pass
          if not keys and os.environ.get('GEMINI_API_KEY', '').strip():
              keys = [os.environ['GEMINI_API_KEY'].strip()]
          if not keys:
              print('هیچ کلید جمینی تنظیم نشده است')
          else:
              print(f'تعداد کلیدهای استخر: {len(keys)}')
          # آزمون واقعی endpoint سازگار OpenAI (همان مسیر زنجیرهٔ ربات) با چند نام مدل
          key0 = keys[0] if keys else ''
          if key0:
              for model in ['gemini-flash-latest', 'gemini-3.5-flash', 'gemini-2.5-flash', 'gemini-3.6-flash']:
                  req = urllib.request.Request(
                      'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions',
                      data=json.dumps({'model': model, 'messages': [{'role': 'user', 'content': 'فقط بنویس: سلام'}], 'max_tokens': 10}).encode(),
                      headers={'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key0})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          txt = json.load(r)['choices'][0]['message']['content']
                          print(f'model {model}: OK — پاسخ: {txt[:40]}')
                  except urllib.error.HTTPError as e:
                      try:
                          detail = json.loads(e.read()).get('error', {}).get('message', '')[:200]
                      except Exception:
                          detail = f'HTTP {e.code}'
                      print(f'model {model}: FAIL — {detail}')
                  except Exception as e:
                      print(f'model {model}: FAIL — {str(e)[:200]}')
          for i, k in enumerate(keys):
              masked = (k[:6] + '…' + k[-4:]) if len(k) > 12 else '***'
              url = 'https://generativelanguage.googleapis.com/v1beta/models?key=' + k
              try:
                  with urllib.request.urlopen(url, timeout=25) as r:
                      data = json.load(r)
                      models = data.get('models', [])
                      print(f'کلید {i+1} ({masked}): OK — {len(models)} مدل در دسترس')
                      for m in models[:40]:
                          print('   ', m.get('name', '?'))
              except urllib.error.HTTPError as e:
                  try:
                      detail = json.loads(e.read()).get('error', {}).get('message', '')[:220]
                  except Exception:
                      detail = f'HTTP {e.code}'
                  print(f'کلید {i+1} ({masked}): FAIL — {detail}')
              except Exception as e:
                  print(f'کلید {i+1} ({masked}): FAIL — {str(e)[:220]}')
          PY
