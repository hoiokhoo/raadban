plugins { id 'com.android.application' }

android {
    namespace 'app.raadban.viewer'
    compileSdk 35

    defaultConfig {
        applicationId 'app.raadban.viewer'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1'
        // نشانی پیش‌فرض سرور — از ورودی ورک‌فلو (APP_URL) یا پیش‌فرض خالی
        resValue 'string', 'app_default_url', (project.findProperty('APP_URL') ?: '')
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // هم‌ترازی نسخهٔ kotlin-stdlib — جلوگیری از Duplicate class بین stdlib 1.8+ و jdk7/jdk8 قدیمی
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'align kotlin stdlib versions'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'align kotlin stdlib versions'
        }
    }
}
