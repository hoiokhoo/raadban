<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1404" viewBox="0 0 1080 1404">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2239"/><stop offset="1" stop-color="#164a75"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1404" fill="#0a1c30"/>
  
  <rect width="1080" height="240" fill="url(#hdr)"/>
  <text x="1044" y="86" font-size="42" font-weight="700" fill="#ffffff" text-anchor="end">‫توییت‌های مقامات تأثیرگذار‬</text>
  <text x="1044" y="140" font-size="26" fill="#9fc3e8" text-anchor="end">‫پنجشنبه ۲۸ آبان ۱۴۰۵ • ۱۹ نوامبر ۲۰۲۶‬</text>
  <text x="1044" y="200" font-size="30" font-weight="500" fill="#ffd75e" text-anchor="end">‫۳ پست این بازه • ۱ بازتاب چندمنبعی‬</text>
  
  <rect x="548.0" y="262" width="496.0" height="66" rx="14" fill="#123a5e"/>
  <text x="796.0" y="292" font-size="20" fill="#8fb8d9" text-anchor="middle">‫پلتفرم‬</text>
  <text x="796.0" y="326" font-size="23" font-weight="700" fill="#e8f1fa" text-anchor="middle">‫𝕏 ایکس + 🅣 تروث‌سوشال‬</text>
  <rect x="36.0" y="262" width="496.0" height="66" rx="14" fill="#123a5e"/>
  <text x="284.0" y="292" font-size="20" fill="#8fb8d9" text-anchor="middle">‫ترجمه‬</text>
  <text x="284.0" y="326" font-size="23" font-weight="700" fill="#e8f1fa" text-anchor="middle">‫کامل و روان — بدون خلاصه‌سازی‬</text>
  
  <rect x="36" y="364" width="1008" height="372" rx="14" fill="#102941"/>
  <text x="1016" y="402" font-size="24" font-weight="700" fill="#9fc3e8" text-anchor="end">‫🅣 Donald Trump (تروث‌سوشال)‬ ✅</text>
  <text x="1016" y="446" font-size="27" font-weight="700" fill="#ffd75e" text-anchor="end">‫دونالد ترامپ (رئیس‌جمهور آمریکا)‬</text>
  <text x="1016" y="520" font-size="26" fill="#e8f1fa" text-anchor="end">‫ما در کاخ سفید در حال برگزاری جلسات متعددی دربارهٔ موضوعات‬</text>
<text x="1016" y="560" font-size="26" fill="#e8f1fa" text-anchor="end">‫مختلف هستیم. روزهای هیجان‌انگیزی در پیش است! به‌زودی اخبار‬</text>
<text x="1016" y="600" font-size="26" fill="#e8f1fa" text-anchor="end">‫مهمی دربارهٔ توافق اقتصادی با چند کشور بزرگ اعلام خواهم کرد.‬</text>
<text x="1016" y="640" font-size="26" fill="#e8f1fa" text-anchor="end">‫این توافق‌ها برای کارگران آمریکایی فوق‌العاده خواهد بود و‬</text>
<text x="1016" y="680" font-size="26" fill="#e8f1fa" text-anchor="end">‫هزاران شغل جدید ایجاد می‌کند. منتظر جزئیات کامل باشید —‬</text>
<text x="1016" y="720" font-size="26" fill="#e8f1fa" text-anchor="end">‫همه‌چیز طبق برنامه و بهتر از انتظار پیش می‌رود.‬</text>
  <rect x="36" y="748" width="1008" height="292" rx="14" fill="#0d2135"/>
  <text x="1016" y="786" font-size="24" font-weight="700" fill="#9fc3e8" text-anchor="end">‫𝕏 mb_ghalibaf‬</text>
  <text x="1016" y="830" font-size="27" font-weight="700" fill="#ffd75e" text-anchor="end">‫محمدباقر قالیباف (رئیس مجلس شورای اسلامی)‬</text>
  <text x="1016" y="904" font-size="26" fill="#e8f1fa" text-anchor="end">‫سیاست خارجی آمریکا، یا هر قدرت دیگری، هیچ‌گاه منافع ملت ایران‬</text>
<text x="1016" y="944" font-size="26" fill="#e8f1fa" text-anchor="end">‫را تأمین نمی‌کند. ما بر پایهٔ عزت، خردمندی و مصلحت حرکت‬</text>
<text x="1016" y="984" font-size="26" fill="#e8f1fa" text-anchor="end">‫می‌کنیم؛ نه بر پایهٔ تنش‌سازی و نه ذلت. راه تیم مذاکره‌کننده‬</text>
<text x="1016" y="1024" font-size="26" fill="#e8f1fa" text-anchor="end">‫باید کاملاً شفاف و تحت نظارت مجلس باشد.‬</text>
  <rect x="36" y="1052" width="1008" height="252" rx="14" fill="#102941"/>
  <text x="1016" y="1090" font-size="24" font-weight="700" fill="#9fc3e8" text-anchor="end">‫𝕏 araghchi‬</text>
  <text x="1016" y="1134" font-size="27" font-weight="700" fill="#ffd75e" text-anchor="end">‫سعید عراقچی (وزیر خارجه)‬</text>
  <text x="1016" y="1208" font-size="26" fill="#e8f1fa" text-anchor="end">‫دیپلماسی ایران فعال است؛ اما شفافیت و اعتماد مسیر دوطرفه‬</text>
<text x="1016" y="1248" font-size="26" fill="#e8f1fa" text-anchor="end">‫می‌خواهد. مذاکره فقط وقتی نتیجه می‌دهد که طرف مقابل به تعهداتش‬</text>
<text x="1016" y="1288" font-size="26" fill="#e8f1fa" text-anchor="end">‫پایبند بماند.‬</text>
  
  <text x="1044" y="1370" font-size="20" fill="#6f93b4" text-anchor="end">‫رصدبان • توییت/تروث‌سوشال مقامات تأثیرگذار‬</text>
  <text x="36" y="1370" font-size="20" fill="#6f93b4" text-anchor="start">‫ترجمهٔ وفادار کامل — بدون خلاصه‌سازی‬</text>
</svg>